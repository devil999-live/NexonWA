<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXON // Multi-User Gateway</title>
    <style>
        :root {
            --bg-obsidian: #06080e;
            --bg-card: rgba(15, 21, 36, 0.92);
            --border-subtle: rgba(148, 163, 184, 0.14);
            --border-indigo: rgba(99, 102, 241, 0.48);
            --accent-indigo: #6366f1;
            --accent-indigo-bright: #818cf8;
            --accent-emerald: #10b981;
            --accent-emerald-bright: #34d399;
            --accent-crimson: #ef4444;
            --accent-crimson-bright: #f43f5e;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --shadow-deck: 0 24px 60px rgba(0, 0, 0, 0.78);
            --shadow-indigo: 0 0 28px rgba(99, 102, 241, 0.25);
            --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-obsidian);
            background-image:
                radial-gradient(circle at 18% 12%, rgba(99, 102, 241, 0.2), transparent 44%),
                radial-gradient(circle at 84% 18%, rgba(16, 185, 129, 0.13), transparent 42%),
                linear-gradient(180deg, #06080e 0%, #090d18 60%, #06080e 100%);
            color: var(--text-primary);
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            overflow-x: hidden;
        }

        @keyframes portalEnter {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes sectionSwitch {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 18px rgba(99, 102, 241, 0.22); }
            50% { box-shadow: 0 0 30px rgba(16, 185, 129, 0.24); }
        }

        .portal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 22px;
            padding: 34px 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: var(--shadow-deck), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(18px);
            position: relative;
            overflow: hidden;
            animation: portalEnter 0.65s var(--ease-smooth) both, pulseGlow 6s ease-in-out infinite;
        }

        .portal-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-indigo), var(--accent-emerald));
        }

        .eyebrow {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent-indigo-bright);
            text-align: center;
            margin-bottom: 6px;
        }

        h2 {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            text-align: center;
            background: linear-gradient(120deg, #ffffff 15%, #c7d2fe 60%, #6ee7b7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 6px;
            margin-bottom: 22px;
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: rgba(6, 8, 14, 0.85);
            border: 1px solid var(--border-subtle);
            padding: 6px;
            border-radius: 14px;
            margin-bottom: 22px;
            position: relative;
        }

        .tab {
            padding: 10px 12px;
            text-align: center;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border-radius: 10px;
            transition: all 0.28s var(--ease-smooth);
            user-select: none;
        }

        .tab:hover {
            color: var(--text-primary);
        }

        .tab.active {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.26), rgba(16, 185, 129, 0.16));
            color: #ffffff;
            border: 1px solid rgba(129, 140, 248, 0.45);
            box-shadow: 0 6px 18px rgba(99, 102, 241, 0.24);
            transform: translateY(-1px);
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
            animation: sectionSwitch 0.35s var(--ease-smooth) both;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.74rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            background: rgba(6, 8, 14, 0.92);
            border: 1px solid var(--border-subtle);
            padding: 12px 14px;
            border-radius: 11px;
            color: var(--text-primary);
            font-size: 0.92rem;
            outline: none;
            transition: all 0.25s var(--ease-smooth);
        }

        input:focus {
            border-color: var(--accent-indigo-bright);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.22);
            transform: translateY(-1px);
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-indigo), #4f46e5);
            color: #ffffff;
            border: 1px solid rgba(129, 140, 248, 0.5);
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
            font-size: 0.88rem;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 8px 22px rgba(99, 102, 241, 0.3);
            transition: all 0.28s var(--ease-spring);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(99, 102, 241, 0.45);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-emerald {
            background: linear-gradient(135deg, var(--accent-emerald), #059669);
            color: #05110d;
            border-color: rgba(52, 211, 153, 0.55);
            box-shadow: 0 8px 22px rgba(16, 185, 129, 0.28);
        }

        .btn-emerald:hover {
            box-shadow: 0 12px 28px rgba(16, 185, 129, 0.44);
        }

        .google-btn {
            background: linear-gradient(135deg, var(--accent-crimson), #be123c);
            color: #ffffff;
            border-color: rgba(244, 63, 94, 0.45);
            margin-top: 10px;
            box-shadow: 0 8px 22px rgba(239, 68, 68, 0.26);
        }

        .google-btn:hover {
            box-shadow: 0 12px 28px rgba(239, 68, 68, 0.42);
        }

        #error-msg {
            color: var(--accent-crimson-bright);
            font-size: 0.82rem;
            text-align: center;
            margin-top: 14px;
            font-weight: 600;
            min-height: 18px;
        }

        /* Mobile Device Adaptation */
        @media (max-width: 640px), (pointer: coarse) {
            body {
                padding: 14px 12px;
                align-items: center;
                -webkit-tap-highlight-color: transparent;
            }
            .portal-card {
                padding: 24px 18px;
                border-radius: 18px;
                max-width: 100%;
            }
            h2 {
                font-size: 1.45rem;
            }
            .tab, input, .btn {
                min-height: 44px;
                font-size: 0.92rem;
            }
        }

        body.is-mobile-device .portal-card {
            border-color: rgba(99, 102, 241, 0.42);
        }
    </style>
</head>
<body>
    <div class="portal-card" id="portal-card">
        <div class="eyebrow">Obsidian-Titanium Gateway</div>
        <h2>NEXON PORTAL</h2>
        <div class="subtitle">Multi-User WhatsApp Automation Hub</div>

        <div class="tabs">
            <div class="tab active" id="tab-signup" onclick="switchTab('signup')">Sign Up</div>
            <div class="tab" id="tab-login" onclick="switchTab('login')">Sign In</div>
        </div>

        <!-- SIGNUP SECTION (DEFAULT FOR NEW USERS) -->
        <div id="signup-section" class="form-section active">
            <div class="form-group">
                <label>New Email Address</label>
                <input type="email" id="signup-email" placeholder="Enter new email...">
            </div>
            <div class="form-group">
                <label>Create Password</label>
                <input type="password" id="signup-password" placeholder="Create password...">
            </div>
            <button type="button" class="btn btn-emerald" onclick="signupUser()">Create Account & Setup</button>
            <button type="button" class="btn google-btn" onclick="loginGoogle()">Sign Up with Google</button>
        </div>

        <!-- LOGIN SECTION -->
        <div id="login-section" class="form-section">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="login-email" placeholder="Enter email...">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="Enter password...">
            </div>
            <button type="button" class="btn" onclick="loginEmail()">Sign In</button>
            <button type="button" class="btn google-btn" onclick="loginGoogle()">Sign In with Google</button>
        </div>

        <div id="error-msg"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcu6F3WznyrGT-gwv0g00FbziINprN4gg",
            authDomain: "wa-nexon-v9.firebaseapp.com",
            projectId: "wa-nexon-v9",
            storageBucket: "wa-nexon-v9.firebasestorage.app",
            messagingSenderId: "226842783211",
            appId: "1:226842783211:web:822775e81ee0f52f667dae"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        function detectMobileDevice() {
            const uaMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const smallScreen = window.innerWidth <= 768;
            if (uaMobile || smallScreen) {
                document.body.classList.add('is-mobile-device');
            } else {
                document.body.classList.remove('is-mobile-device');
            }
        }
        detectMobileDevice();
        window.addEventListener('resize', detectMobileDevice);

        // Auto-redirect to dashboard if already logged in
        const savedUid = localStorage.getItem('nexonUserId');
        if (savedUid) {
            window.location.replace(`/dashboard.html?userId=${encodeURIComponent(savedUid)}`);
        }

        window.switchTab = (tab) => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
            if (tab === 'login') {
                document.getElementById('tab-login').classList.add('active');
                document.getElementById('login-section').classList.add('active');
            } else {
                document.getElementById('tab-signup').classList.add('active');
                document.getElementById('signup-section').classList.add('active');
            }
        };

        window.loginDevMode = () => {
            const username = document.getElementById('dev-user-id')?.value?.trim();
            if (!username) {
                document.getElementById('error-msg').textContent = '⚠️ Please enter a test username!';
                return;
            }
            const cleanUid = 'user_' + username.replace(/[^a-zA-Z0-9_]/g, '_');
            localStorage.setItem('nexonUserId', cleanUid);
            window.location.href = `/dashboard.html?userId=${encodeURIComponent(cleanUid)}`;
        };

        async function syncUserProfile(userId, email) {
            if (!email) return;
            try {
                await fetch('/api/user-profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, email })
                });
            } catch (err) {
                console.error('Failed to sync profile email:', err);
            }
        }

        window.loginEmail = async () => {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('error-msg');
            errorEl.textContent = '';

            if (!email || !password) {
                errorEl.textContent = '⚠️ Please enter both email and password.';
                return;
            }

            try {
                const res = await signInWithEmailAndPassword(auth, email, password);
                const uid = res.user.uid;
                const userEmail = res.user.email || email;
                localStorage.setItem('nexonUserId', uid);
                await syncUserProfile(uid, userEmail);
                window.location.href = `/dashboard.html?userId=${encodeURIComponent(uid)}`;
            } catch (err) {
                // If the email doesn't exist yet, switch to Sign Up and register immediately
                if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
                    window.switchTab('signup');
                    document.getElementById('signup-email').value = email;
                    document.getElementById('signup-password').value = password;
                    try {
                        const created = await createUserWithEmailAndPassword(auth, email, password);
                        const uid = created.user.uid;
                        const userEmail = created.user.email || email;
                        localStorage.setItem('nexonUserId', uid);
                        await syncUserProfile(uid, userEmail);
                        window.location.href = `/dashboard.html?userId=${encodeURIComponent(uid)}`;
                        return;
                    } catch (signupErr) {
                        errorEl.textContent = '❌ ' + signupErr.message;
                        return;
                    }
                }
                errorEl.textContent = '❌ ' + err.message;
            }
        };

        window.signupUser = async () => {
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const errorEl = document.getElementById('error-msg');
            errorEl.textContent = '';
            try {
                const res = await createUserWithEmailAndPassword(auth, email, password);
                const uid = res.user.uid;
                const userEmail = res.user.email || email;
                localStorage.setItem('nexonUserId', uid);
                await syncUserProfile(uid, userEmail);
                window.location.href = `/dashboard.html?userId=${encodeURIComponent(uid)}`;
            } catch (err) {
                errorEl.textContent = '❌ ' + err.message;
            }
        };

        window.loginGoogle = async () => {
            const errorEl = document.getElementById('error-msg');
            errorEl.textContent = '';
            const provider = new GoogleAuthProvider();
            try {
                const res = await signInWithPopup(auth, provider);
                const uid = res.user.uid;
                const email = res.user.email;
                localStorage.setItem('nexonUserId', uid);

                if (email) {
                    await syncUserProfile(uid, email);
                }

                window.location.href = `/dashboard.html?userId=${encodeURIComponent(uid)}`;
            } catch (err) {
                errorEl.textContent = '❌ ' + err.message;
            }
        };
    </script>
</body>
</html>
