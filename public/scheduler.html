<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXON // Message Scheduler</title>
    <style>
        :root {
            --bg-obsidian: #06080e;
            --bg-card: rgba(15, 21, 36, 0.9);
            --border-subtle: rgba(148, 163, 184, 0.14);
            --border-indigo: rgba(99, 102, 241, 0.48);
            --accent-indigo: #6366f1;
            --accent-indigo-bright: #818cf8;
            --accent-emerald: #10b981;
            --accent-emerald-bright: #34d399;
            --accent-gold-bright: #fbbf24;
            --accent-crimson: #ef4444;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --shadow-deck: 0 24px 60px rgba(0, 0, 0, 0.78);
            --shadow-indigo: 0 0 28px rgba(99, 102, 241, 0.25);
            --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-obsidian);
            background-image:
                radial-gradient(circle at 15% 10%, rgba(99, 102, 241, 0.18), transparent 42%),
                radial-gradient(circle at 85% 20%, rgba(16, 185, 129, 0.12), transparent 42%),
                linear-gradient(180deg, #06080e 0%, #090d18 60%, #06080e 100%);
            color: var(--text-primary);
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            padding: 32px 24px 60px;
        }

        @keyframes deckSlideUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .wrapper { max-width: 940px; margin: 0 auto; animation: deckSlideUp 0.6s var(--ease-smooth) both; }

        .back-btn {
            display: inline-flex; align-items: center; gap: 8px;
            color: var(--accent-indigo-bright); text-decoration: none;
            font-size: 0.86rem; font-weight: 600; margin-bottom: 18px;
            padding: 8px 14px; border-radius: 10px;
            background: rgba(15, 21, 36, 0.75); border: 1px solid var(--border-subtle);
            transition: all 0.25s var(--ease-smooth);
        }
        .back-btn:hover {
            color: #fff; border-color: var(--border-indigo);
            transform: translateX(-3px); box-shadow: var(--shadow-indigo);
        }

        .panel {
            background: var(--bg-card); border: 1px solid var(--border-subtle);
            border-radius: 20px; padding: 34px;
            box-shadow: var(--shadow-deck), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px); position: relative; overflow: hidden;
        }
        .panel::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--accent-indigo), var(--accent-emerald));
        }

        .special-panel {
            margin-top: 24px;
        }
        .special-panel::before {
            background: linear-gradient(90deg, var(--accent-gold-bright), var(--accent-indigo-bright), var(--accent-emerald-bright));
        }

        .eyebrow {
            font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em;
            text-transform: uppercase; color: var(--accent-indigo-bright); margin-bottom: 6px;
        }
        .special-panel .eyebrow {
            color: var(--accent-gold-bright);
        }

        h2 { font-size: 1.65rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 22px; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 18px; }
        @media (max-width: 760px) { .grid-2 { grid-template-columns: 1fr; } }

        .form-group { margin-bottom: 18px; }
        label {
            display: block; font-size: 0.76rem; font-weight: 700;
            letter-spacing: 0.08em; text-transform: uppercase;
            color: var(--text-secondary); margin-bottom: 8px;
        }

        input[type="text"], input[type="tel"], input[type="date"], select, textarea {
            width: 100%; background: rgba(6, 8, 14, 0.92);
            border: 1px solid var(--border-subtle); padding: 12px 14px;
            color: var(--text-primary); border-radius: 11px; font-size: 0.9rem; outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-indigo-bright);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .datetime-box {
            position: relative; width: 100%; margin-bottom: 16px; cursor: pointer;
            border-radius: 11px; border: 1px solid rgba(99, 102, 241, 0.45);
            background: linear-gradient(145deg, rgba(12, 17, 30, 0.94), rgba(6, 8, 14, 0.98));
            transition: all 0.28s var(--ease-smooth);
        }
        .datetime-box:hover, .datetime-box:focus-within {
            border-color: var(--accent-emerald-bright);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.22);
        }
        input[type="datetime-local"] {
            width: 100%; background: transparent; border: none;
            padding: 12px 14px; color: var(--accent-indigo-bright);
            font-size: 0.92rem; font-weight: 700; outline: none; cursor: pointer; display: block;
        }

        .file-upload-box {
            border: 2px dashed rgba(99, 102, 241, 0.45);
            background: linear-gradient(145deg, rgba(12, 17, 30, 0.92), rgba(7, 10, 18, 0.96));
            padding: 16px; border-radius: 12px; text-align: center; cursor: pointer;
            transition: all 0.28s var(--ease-smooth);
        }
        .file-upload-box:hover {
            border-color: var(--accent-emerald-bright);
            background: rgba(16, 185, 129, 0.06);
            transform: translateY(-2px);
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-emerald), #059669);
            color: #05110d; border: 1px solid rgba(52, 211, 153, 0.55);
            padding: 13px 20px; font-weight: 700; border-radius: 12px; cursor: pointer;
            letter-spacing: 0.04em; width: 100%; font-size: 0.88rem;
            box-shadow: 0 8px 22px rgba(16, 185, 129, 0.28);
            transition: all 0.28s var(--ease-smooth);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(16, 185, 129, 0.42); }
        .btn:active { transform: translateY(0) scale(0.98); }

        .btn-special {
            background: linear-gradient(135deg, var(--accent-indigo), #4f46e5);
            color: #fff; border: 1px solid rgba(129, 140, 248, 0.55);
            box-shadow: 0 8px 22px rgba(99, 102, 241, 0.3);
        }
        .btn-special:hover {
            box-shadow: 0 12px 28px rgba(99, 102, 241, 0.46);
        }

        .btn-plus {
            width: 44px; height: 44px; border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-indigo), #4f46e5);
            color: #fff; border: 1px solid rgba(129, 140, 248, 0.55);
            font-size: 1.45rem; font-weight: 800; line-height: 1;
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
            transition: all 0.25s var(--ease-smooth);
        }
        .btn-plus:hover {
            transform: scale(1.06);
            box-shadow: 0 10px 26px rgba(99, 102, 241, 0.5);
        }

        .special-initial-plus-wrap {
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .special-plus-anchor {
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .special-slots-container {
            display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px;
        }

        .special-slot-block {
            display: flex;
            flex-direction: column;
            padding: 12px;
            border-radius: 14px;
            background: rgba(6, 8, 14, 0.88);
            border: 1px solid rgba(99, 102, 241, 0.35);
            animation: deckSlideUp 0.28s var(--ease-smooth) both;
        }

        .special-slot-row {
            display: grid;
            grid-template-columns: 270px 1fr auto;
            gap: 12px;
            align-items: center;
        }
        @media (max-width: 820px) {
            .special-slot-row {
                grid-template-columns: 1fr;
            }
        }

        .time-12h-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }
        .time-12h-group select {
            padding: 10px 8px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-gold-bright);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--accent-crimson), #be123c);
            padding: 6px 12px; font-size: 0.74rem; color: #fff; border: none;
            border-radius: 8px; cursor: pointer; font-weight: 700;
        }

        .contact-list-box {
            max-height: 185px; overflow-y: auto; border: 1px solid var(--border-subtle);
            border-radius: 12px; background: rgba(6, 8, 14, 0.88); padding: 8px; margin-bottom: 10px;
        }
        .contact-item {
            padding: 8px 12px; border-bottom: 1px solid rgba(148, 163, 184, 0.09);
            font-size: 0.84rem; display: flex; align-items: center; gap: 10px;
        }
        .contact-item:hover { background: rgba(99, 102, 241, 0.09); }

        @media (max-width: 640px), (pointer: coarse) {
            body { padding: 16px 12px 44px; -webkit-tap-highlight-color: transparent; }
            .deck-container, .wrapper { width: 100%; }
            .panel { padding: 20px 16px; border-radius: 16px; }
            h2 { font-size: 1.3rem; }
            .btn, .btn-special, .btn-plus, .btn-danger, a.btn, a.back-btn, a.back-link, input, select, textarea { min-height: 44px; }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <a href="dashboard.html" id="back-to-hub" class="back-btn">← Back to Hub</a>

        <!-- MAIN MESSAGE SCHEDULER -->
        <div class="panel">
            <div class="eyebrow">Timed Dispatch Queue (IST)</div>
            <h2>⏰ Message Scheduler & Multi-File Dispatcher</h2>
            <div class="grid-2">
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Select Recipients:</label>
                    <input type="text" id="schedule-contact-search" placeholder="Search contact..." onkeyup="filterScheduleContacts()" style="margin-bottom: 8px;">
                    <div class="contact-list-box" id="schedule-contacts-box"></div>
                    <label style="margin-top: 10px;">Quick Direct Number Input (Without Saving VCF):</label>
                    <input type="tel" id="schedule-direct-number" placeholder="e.g. +919876543210 or 9876543210">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Select Date & Time - IST (Click Anywhere in Box):</label>
                    <div class="datetime-box" onclick="openScheduleDatePicker()">
                        <input type="datetime-local" id="schedule-datetime">
                    </div>

                    <label>Choose Multiple Attachment Files from PC:</label>
                    <div class="file-upload-box" onclick="document.getElementById('schedule-media-file').click()">
                        <p style="font-size: 0.86rem; color: var(--accent-indigo-bright); font-weight: 700;" id="file-chosen-label">📂 Click to select multiple files from PC</p>
                        <input type="file" id="schedule-media-file" multiple style="display: none;">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Message Content / Caption:</label>
                <textarea id="schedule-message-text" rows="3" placeholder="Type message..."></textarea>
            </div>
            <button type="button" class="btn" onclick="saveScheduledMessage()">📅 Schedule Message with Multiple Files</button>

            <h3 style="color: var(--accent-indigo-bright); font-size: 1rem; margin-top: 28px; margin-bottom: 12px;">Active Scheduled Queue</h3>
            <div class="contact-list-box" id="scheduled-list-box" style="max-height: 190px;"></div>
        </div>

        <!-- SPECIAL MESSAGE SECTION (SINGLE RECIPIENT, 12-HOUR MINUTE PRECISION, AUTO-INCREMENT +1 MIN, + BUTTON UNDER LATEST ENTRY) -->
        <div class="panel special-panel">
            <div class="eyebrow">Single Recipient • 12-Hour IST • Text Only</div>
            <h2>✨ Special Message</h2>

            <div class="grid-2">
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Select Recipient:</label>
                    <input type="text" id="special-contact-search" placeholder="Search contact..." onkeyup="filterSpecialContacts()" style="margin-bottom: 8px;">
                    <div class="contact-list-box" id="special-contacts-box"></div>
                </div>

                <div class="form-group" style="margin-bottom: 0;">
                    <label>Quick Direct Number Input (Without Saving VCF):</label>
                    <input type="tel" id="special-direct-number" placeholder="e.g. +919876543210 or 9876543210" style="margin-bottom: 14px;">

                    <label>Select Date (Indian Timezone - IST):</label>
                    <input type="date" id="special-date">
                </div>
            </div>

            <div class="special-initial-plus-wrap" id="special-initial-plus-wrap">
                <button type="button" class="btn-plus" onclick="addSpecialTimeRow()" title="Add Time & Message Box">+</button>
                <span style="font-size: 0.82rem; color: var(--text-secondary);">Click <b>+</b> to add a Special Message entry (12-hour time on left, message on right).</span>
            </div>

            <div class="special-slots-container" id="special-slots-container"></div>

            <button type="button" class="btn btn-special" onclick="saveSpecialMessage()">✨ Schedule Special Message</button>
        </div>
    </div>

    <script>
        let cachedContacts = [];
        let selectedSpecialContactId = '';

        function initSpecialDefaultDate() {
            const istNow = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' }));
            const yyyy = istNow.getFullYear();
            const mm = String(istNow.getMonth() + 1).padStart(2, '0');
            const dd = String(istNow.getDate()).padStart(2, '0');
            document.getElementById('special-date').value = `${yyyy}-${mm}-${dd}`;
        }

        function buildHour12Options(selectedHour = '11') {
            let opts = '';
            for (let h = 1; h <= 12; h++) {
                const hh = String(h).padStart(2, '0');
                opts += `<option value="${hh}" ${hh === selectedHour ? 'selected' : ''}>${hh} hr</option>`;
            }
            return opts;
        }

        function buildMinuteOptions(selectedMin = '57') {
            let opts = '';
            for (let m = 0; m < 60; m++) {
                const mm = String(m).padStart(2, '0');
                opts += `<option value="${mm}" ${mm === selectedMin ? 'selected' : ''}>${mm} min</option>`;
            }
            return opts;
        }

        function getNextAutoTimeFromLastRow() {
            const blocks = document.querySelectorAll('#special-slots-container .special-slot-block');
            if (!blocks.length) {
                return { hour: '11', minute: '57', period: 'PM' };
            }
            const lastBlock = blocks[blocks.length - 1];
            let hr = parseInt(lastBlock.querySelector('.sp-hour').value, 10);
            let min = parseInt(lastBlock.querySelector('.sp-minute').value, 10);
            let period = lastBlock.querySelector('.sp-period').value;

            min += 1;
            if (min >= 60) {
                min = 0;
                if (hr === 11) {
                    hr = 12;
                    period = period === 'AM' ? 'PM' : 'AM';
                } else if (hr === 12) {
                    hr = 1;
                } else {
                    hr += 1;
                }
            }

            return {
                hour: String(hr).padStart(2, '0'),
                minute: String(min).padStart(2, '0'),
                period
            };
        }

        function repositionPlusButtonUnderLatestRow() {
            const existingAnchor = document.getElementById('special-plus-anchor');
            if (existingAnchor) existingAnchor.remove();

            const container = document.getElementById('special-slots-container');
            const initialWrap = document.getElementById('special-initial-plus-wrap');
            const blocks = container.querySelectorAll('.special-slot-block');

            if (!blocks.length) {
                initialWrap.style.display = 'flex';
                return;
            }

            initialWrap.style.display = 'none';
            const lastBlock = blocks[blocks.length - 1];
            const anchor = document.createElement('div');
            anchor.id = 'special-plus-anchor';
            anchor.className = 'special-plus-anchor';
            anchor.innerHTML = `
                <button type="button" class="btn-plus" onclick="addSpecialTimeRow()" title="Add Next Time & Message Box">+</button>
                <span style="font-size: 0.78rem; color: var(--text-secondary);">Add another entry below</span>
            `;
            lastBlock.appendChild(anchor);
        }

        function addSpecialTimeRow() {
            const container = document.getElementById('special-slots-container');
            const nextTime = getNextAutoTimeFromLastRow();

            const block = document.createElement('div');
            block.className = 'special-slot-block';
            block.innerHTML = `
                <div class="special-slot-row">
                    <div class="time-12h-group">
                        <select class="sp-hour" aria-label="Hour (12h)">
                            ${buildHour12Options(nextTime.hour)}
                        </select>
                        <select class="sp-minute" aria-label="Minute">
                            ${buildMinuteOptions(nextTime.minute)}
                        </select>
                        <select class="sp-period" aria-label="AM/PM">
                            <option value="AM" ${nextTime.period === 'AM' ? 'selected' : ''}>AM</option>
                            <option value="PM" ${nextTime.period === 'PM' ? 'selected' : ''}>PM</option>
                        </select>
                    </div>
                    <input type="text" class="sp-message" placeholder="Enter your special message for this time...">
                    <button type="button" class="btn-danger" onclick="removeSpecialSlotBlock(this)" title="Remove slot">✕</button>
                </div>
            `;
            container.appendChild(block);
            repositionPlusButtonUnderLatestRow();
        }

        function removeSpecialSlotBlock(btnEl) {
            const block = btnEl.closest('.special-slot-block');
            if (block) block.remove();
            repositionPlusButtonUnderLatestRow();
        }

        function openScheduleDatePicker() {
            const dtInput = document.getElementById('schedule-datetime');
            if (!dtInput) return;
            dtInput.focus();
            if (typeof dtInput.showPicker === 'function') {
                try { dtInput.showPicker(); } catch (e) {}
            }
        }

        function resolveUserId() {
            const params = new URLSearchParams(window.location.search);
            const fromQuery = params.get('userId');
            if (fromQuery && fromQuery !== 'undefined' && fromQuery !== 'null') {
                localStorage.setItem('nexonUserId', fromQuery.trim());
                return fromQuery.trim();
            }
            const candidates = [
                localStorage.getItem('nexonUserId'),
                localStorage.getItem('nexon_userId'),
                localStorage.getItem('userId')
            ];
            for (const val of candidates) {
                if (val && val !== 'undefined' && val !== 'null') return val.trim();
            }
            return 'default_user';
        }

        const currentUserId = resolveUserId();
        document.getElementById('back-to-hub').href = `dashboard.html?userId=${encodeURIComponent(currentUserId)}`;

        function apiHeaders() {
            return { 'userid': currentUserId };
        }

        document.getElementById('schedule-media-file').addEventListener('change', function() {
            if (this.files.length > 0) {
                document.getElementById('file-chosen-label').textContent = `✨ ${this.files.length} file(s) selected`;
            } else {
                document.getElementById('file-chosen-label').textContent = '📂 Click to select multiple files from PC';
            }
        });

        async function init() {
            initSpecialDefaultDate();
            try {
                const resC = await fetch(`/api/contacts?userId=${encodeURIComponent(currentUserId)}`, { headers: apiHeaders() });
                cachedContacts = await resC.json();
                renderScheduleContactsList(cachedContacts);
                renderSpecialContactsList(cachedContacts);
                fetchScheduledMessages();
            } catch (e) { console.error(e); }
        }

        function renderScheduleContactsList(contacts, query = '') {
            const box = document.getElementById('schedule-contacts-box');
            if (!contacts.length) {
                box.innerHTML = `<div class="contact-item" style="color: var(--text-secondary);">No VCF contacts. You can still enter a direct number below.</div>`;
                return;
            }
            const filtered = contacts.filter(c => c.name.toLowerCase().includes(query.toLowerCase()) || c.id.includes(query));
            box.innerHTML = '';
            filtered.forEach(c => {
                box.innerHTML += `
                    <div class="contact-item">
                        <input type="checkbox" class="schedule-contact-cb" value="${c.id}" style="width: auto; cursor: pointer;">
                        <span style="flex-grow: 1;">${c.name}</span>
                        <span style="color: var(--accent-indigo-bright); font-size: 0.76rem; font-family: monospace;">${c.id}</span>
                    </div>
                `;
            });
        }

        function filterScheduleContacts() {
            renderScheduleContactsList(cachedContacts, document.getElementById('schedule-contact-search').value);
        }

        function toggleSingleSpecialContact(checkboxEl, contactId) {
            if (checkboxEl.checked) {
                selectedSpecialContactId = contactId;
                document.querySelectorAll('.special-contact-cb').forEach(cb => {
                    if (cb !== checkboxEl) cb.checked = false;
                });
            } else if (selectedSpecialContactId === contactId) {
                selectedSpecialContactId = '';
            }
        }

        function renderSpecialContactsList(contacts, query = '') {
            const box = document.getElementById('special-contacts-box');
            if (!contacts.length) {
                box.innerHTML = `<div class="contact-item" style="color: var(--text-secondary);">No VCF contacts. You can enter a direct number on the right.</div>`;
                return;
            }
            const filtered = contacts.filter(c => c.name.toLowerCase().includes(query.toLowerCase()) || c.id.includes(query));
            box.innerHTML = '';
            filtered.forEach(c => {
                const isChecked = selectedSpecialContactId === c.id ? 'checked' : '';
                box.innerHTML += `
                    <div class="contact-item">
                        <input type="checkbox" class="special-contact-cb" value="${c.id}" ${isChecked} onchange="toggleSingleSpecialContact(this, '${c.id}')" style="width: auto; cursor: pointer;">
                        <span style="flex-grow: 1;">${c.name}</span>
                        <span style="color: var(--accent-indigo-bright); font-size: 0.76rem; font-family: monospace;">${c.id}</span>
                    </div>
                `;
            });
        }

        function filterSpecialContacts() {
            renderSpecialContactsList(cachedContacts, document.getElementById('special-contact-search').value);
        }

        async function saveScheduledMessage() {
            const checkboxes = document.querySelectorAll('.schedule-contact-cb:checked');
            let contactIds = [];
            checkboxes.forEach(cb => contactIds.push(cb.value));
            const directNumber = document.getElementById('schedule-direct-number').value.trim();
            const datetime = document.getElementById('schedule-datetime').value;
            const message = document.getElementById('schedule-message-text').value;
            const fileInput = document.getElementById('schedule-media-file');

            if ((!contactIds.length && !directNumber) || !datetime || !message.trim()) {
                return alert('Select recipients or enter a direct number, datetime, and message!');
            }

            const formData = new FormData();
            formData.append('userId', currentUserId);
            formData.append('contactIds', JSON.stringify(contactIds));
            formData.append('directNumber', directNumber);
            formData.append('datetime', datetime);
            formData.append('message', message);

            for (let i = 0; i < fileInput.files.length; i++) {
                formData.append('mediaFiles', fileInput.files[i]);
            }

            const res = await fetch(`/api/schedule?userId=${encodeURIComponent(currentUserId)}`, {
                method: 'POST',
                headers: apiHeaders(),
                body: formData
            });
            alert((await res.json()).status);

            document.getElementById('schedule-direct-number').value = '';
            fileInput.value = '';
            document.getElementById('file-chosen-label').textContent = '📂 Click to select multiple files from PC';
            fetchScheduledMessages();
        }

        async function saveSpecialMessage() {
            const directNumber = document.getElementById('special-direct-number').value.trim();
            const dateStr = document.getElementById('special-date').value;
            const slotBlocks = document.querySelectorAll('#special-slots-container .special-slot-block');

            if (!selectedSpecialContactId && !directNumber) {
                return alert('Please select a contact or enter a direct phone number!');
            }
            if (!dateStr) {
                return alert('Please select a date!');
            }
            if (!slotBlocks.length) {
                return alert('Click the + button to add at least one time & message slot!');
            }

            const specialSlots = [];
            for (const block of slotBlocks) {
                const hr = block.querySelector('.sp-hour').value;
                const min = block.querySelector('.sp-minute').value;
                const period = block.querySelector('.sp-period').value;
                const msg = block.querySelector('.sp-message').value.trim();
                if (!msg) {
                    return alert(`Please enter a message for ${hr}:${min} ${period}!`);
                }
                specialSlots.push({
                    timeStr: `${hr}:${min}:00`,
                    period,
                    message: msg
                });
            }

            const formData = new FormData();
            formData.append('userId', currentUserId);
            formData.append('scheduleType', 'special_text');
            formData.append('contactIds', JSON.stringify(selectedSpecialContactId ? [selectedSpecialContactId] : []));
            formData.append('directNumber', directNumber);
            formData.append('dateStr', dateStr);
            formData.append('specialSlots', JSON.stringify(specialSlots));

            const res = await fetch(`/api/schedule?userId=${encodeURIComponent(currentUserId)}`, {
                method: 'POST',
                headers: apiHeaders(),
                body: formData
            });
            alert((await res.json()).status);

            document.getElementById('special-direct-number').value = '';
            document.getElementById('special-slots-container').innerHTML = '';
            repositionPlusButtonUnderLatestRow();
            fetchScheduledMessages();
        }

        async function fetchScheduledMessages() {
            const res = await fetch(`/api/schedule?userId=${encodeURIComponent(currentUserId)}`, { headers: apiHeaders() });
            const list = await res.json();
            const box = document.getElementById('scheduled-list-box');
            if (!list.length) {
                box.innerHTML = `<div class="contact-item" style="color: var(--text-secondary); justify-content: center;">No scheduled messages.</div>`;
                return;
            }
            box.innerHTML = '';
            list.forEach(s => {
                const formattedIst = new Date(s.datetime).toLocaleString('en-IN', {
                    timeZone: 'Asia/Kolkata',
                    hour12: true,
                    hour: '2-digit',
                    minute: '2-digit',
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                });
                const tag = s.scheduleType === 'special_text' ? '[Special IST]' : '[Standard]';
                box.innerHTML += `
                    <div class="contact-item" style="justify-content: space-between; gap: 10px; flex-wrap: wrap;">
                        <span><b>${tag} To:</b> ${s.contactIds.length} recipient(s) | <b>IST Time:</b> ${formattedIst}</span>
                        <span style="color: var(--accent-gold-bright);">${s.message}</span>
                        <button type="button" class="btn-danger" onclick="cancelSchedule('${s.id}')">Cancel</button>
                    </div>
                `;
            });
        }

        async function cancelSchedule(id) {
            await fetch(`/api/schedule/${encodeURIComponent(id)}?userId=${encodeURIComponent(currentUserId)}`, {
                method: 'DELETE',
                headers: apiHeaders()
            });
            fetchScheduledMessages();
        }

        window.onload = init;
    </script>
</body>
</html>
