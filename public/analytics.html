<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXON // Analytics Feed</title>
    <style>
        :root {
            --bg-obsidian: #06080e;
            --bg-card: rgba(15, 21, 36, 0.9);
            --border-subtle: rgba(148, 163, 184, 0.14);
            --border-indigo: rgba(99, 102, 241, 0.48);
            --accent-indigo: #6366f1;
            --accent-indigo-bright: #818cf8;
            --accent-emerald: #10b981;
            --accent-emerald-bright: #34d399;
            --accent-gold-bright: #fbbf24;
            --accent-crimson: #ef4444;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --shadow-deck: 0 24px 60px rgba(0, 0, 0, 0.78);
            --shadow-indigo: 0 0 28px rgba(99, 102, 241, 0.25);
            --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-obsidian);
            background-image:
                radial-gradient(circle at 15% 10%, rgba(99, 102, 241, 0.18), transparent 42%),
                radial-gradient(circle at 85% 20%, rgba(16, 185, 129, 0.12), transparent 42%),
                linear-gradient(180deg, #06080e 0%, #090d18 60%, #06080e 100%);
            color: var(--text-primary);
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            padding: 32px 24px 60px;
        }

        @keyframes deckSlideUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes modalSpring {
            from { opacity: 0; transform: scale(0.93) translateY(12px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .wrapper { max-width: 1000px; margin: 0 auto; animation: deckSlideUp 0.6s var(--ease-smooth) both; }

        .back-btn {
            display: inline-flex; align-items: center; gap: 8px;
            color: var(--accent-indigo-bright); text-decoration: none;
            font-size: 0.86rem; font-weight: 600; margin-bottom: 18px;
            padding: 8px 14px; border-radius: 10px;
            background: rgba(15, 21, 36, 0.75); border: 1px solid var(--border-subtle);
            transition: all 0.25s var(--ease-smooth);
        }
        .back-btn:hover {
            color: #fff; border-color: var(--border-indigo);
            transform: translateX(-3px); box-shadow: var(--shadow-indigo);
        }

        .panel {
            background: var(--bg-card); border: 1px solid var(--border-subtle);
            border-radius: 20px; padding: 34px;
            box-shadow: var(--shadow-deck), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px); position: relative; overflow: hidden;
        }
        .panel::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--accent-indigo), var(--accent-emerald));
        }

        .eyebrow {
            font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em;
            text-transform: uppercase; color: var(--accent-indigo-bright); margin-bottom: 6px;
        }
        h2 {
            font-size: 1.55rem; font-weight: 800; letter-spacing: -0.02em;
            margin-bottom: 16px; display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 10px;
        }

        .actions-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }

        .btn-alt {
            background: linear-gradient(135deg, var(--accent-emerald), #059669);
            color: #05110d; border: 1px solid rgba(52, 211, 153, 0.5);
            padding: 8px 14px; font-size: 0.76rem; font-weight: 700;
            border-radius: 10px; cursor: pointer; transition: all 0.25s var(--ease-smooth);
        }
        .btn-alt:hover { transform: translateY(-1px); }

        .btn-danger {
            background: linear-gradient(135deg, var(--accent-crimson), #be123c);
            color: #fff; border: none; padding: 8px 14px; font-size: 0.76rem;
            font-weight: 700; border-radius: 10px; cursor: pointer;
        }

        .table-container {
            max-height: 490px; overflow-y: auto; overflow-x: auto; border: 1px solid var(--border-subtle);
            border-radius: 14px; background: rgba(6, 8, 14, 0.9);
        }

        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.84rem; min-width: 540px; }
        th, td { padding: 12px 14px; border-bottom: 1px solid rgba(148, 163, 184, 0.09); }
        th {
            background: rgba(12, 17, 30, 0.96); color: var(--accent-indigo-bright);
            position: sticky; top: 0; z-index: 10; text-transform: uppercase;
            font-size: 0.72rem; letter-spacing: 0.08em;
        }
        tr:hover { background: rgba(99, 102, 241, 0.06); }

        .history-badge {
            padding: 3px 9px; border-radius: 999px; font-size: 0.68rem;
            text-transform: uppercase; font-weight: 700; display: inline-block;
        }
        .badge-scheduled { background: rgba(245, 158, 11, 0.16); color: var(--accent-gold-bright); border: 1px solid rgba(245, 158, 11, 0.4); }
        .badge-batch { background: rgba(16, 185, 129, 0.16); color: var(--accent-emerald-bright); border: 1px solid rgba(16, 185, 129, 0.4); }
        .badge-fallback { background: rgba(239, 68, 68, 0.16); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
        .badge-incoming, .badge-outgoing { background: rgba(99, 102, 241, 0.16); color: var(--accent-indigo-bright); border: 1px solid rgba(99, 102, 241, 0.4); }
        .badge-system { background: rgba(148, 163, 184, 0.15); color: var(--text-secondary); border: 1px solid rgba(148, 163, 184, 0.3); }

        input[type="checkbox"] { accent-color: var(--accent-indigo-bright); width: 15px; height: 15px; cursor: pointer; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(3, 5, 10, 0.82);
            backdrop-filter: blur(8px); display: none; justify-content: center;
            align-items: center; z-index: 1000; padding: 20px;
        }
        .modal-content {
            background: linear-gradient(150deg, rgba(17, 24, 43, 0.98), rgba(8, 12, 22, 0.99));
            border: 1px solid var(--border-indigo); border-radius: 20px;
            width: 100%; max-width: 620px; padding: 28px;
            box-shadow: var(--shadow-deck), var(--shadow-indigo);
            animation: modalSpring 0.35s var(--ease-spring) both;
        }
        .modal-content h3 { color: var(--accent-indigo-bright); margin-bottom: 14px; font-size: 1.2rem; }
        .modal-body { font-size: 0.88rem; line-height: 1.6; color: var(--text-primary); margin-bottom: 18px; word-break: break-word; }
        .modal-body p { margin-bottom: 8px; }
        .modal-body span { color: var(--text-secondary); }
        .modal-close {
            background: linear-gradient(135deg, var(--accent-crimson), #be123c);
            color: #fff; border: none; padding: 9px 18px; border-radius: 10px;
            cursor: pointer; font-weight: 700; float: right;
        }

        /* Mobile Device Adaptation */
        @media (max-width: 640px), (pointer: coarse) {
            body {
                padding: 16px 12px 44px;
                -webkit-tap-highlight-color: transparent;
            }
            .wrapper {
                width: 100%;
            }
            .panel {
                padding: 20px 16px;
                border-radius: 16px;
            }
            h2 {
                font-size: 1.25rem;
            }
            .actions-bar {
                flex-direction: column;
                align-items: stretch;
            }
            #selection-count {
                margin-left: 0;
                text-align: center;
            }
            button, a.btn, a.back-btn, .modal-close {
                min-height: 44px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <a href="#" id="back-dashboard" class="back-btn">&larr; Back to Control Center</a>
        <div class="panel">
            <div class="eyebrow">Audit Stream</div>
            <h2>
                <span>📊 Live Analytics & System Audit Feed</span>
                <div style="display: flex; gap: 8px;">
                    <button type="button" class="btn-alt" onclick="fetchHistoryLogs()">Refresh</button>
                </div>
            </h2>

            <div class="actions-bar">
                <button type="button" class="btn-alt" style="background: linear-gradient(135deg, var(--accent-indigo), #4f46e5); color: #fff; border-color: rgba(129, 140, 248, 0.45);" onclick="deleteSelectedLogs()">Delete Selected</button>
                <button type="button" class="btn-danger" onclick="clearAllLogs()">Clear All Logs</button>
                <span id="selection-count" style="font-size: 0.8rem; color: var(--text-secondary); margin-left: auto;">0 selected</span>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th width="40"><input type="checkbox" id="selectAllCheckbox" onclick="toggleSelectAll()"></th>
                            <th width="110">Type</th>
                            <th width="160">Recipient / Sender</th>
                            <th>Message Content</th>
                            <th width="115">Timestamp</th>
                        </tr>
                    </thead>
                    <tbody id="logs-table-body">
                        <tr><td colspan="5" style="text-align: center; color: var(--text-secondary); padding: 30px;">Loading activity logs...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="log-modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3>🔍 Log Event Inspector</h3>
            <div class="modal-body" id="modal-details-body"></div>
            <button type="button" class="modal-close" onclick="closeModal()">Close</button>
            <div style="clear: both;"></div>
        </div>
    </div>

    <script>
        let globalLogs = [];

        function getUserId() {
            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('userId') || localStorage.getItem('nexonUserId');
            if (userId) {
                document.getElementById('back-dashboard').setAttribute('href', `/dashboard.html?userId=${encodeURIComponent(userId)}`);
            } else {
                document.getElementById('back-dashboard').setAttribute('href', `/dashboard.html`);
            }
            return userId || 'default_user';
        }

        async function fetchHistoryLogs() {
            const activeSelectedIds = Array.from(document.querySelectorAll('.log-checkbox:checked')).map(cb => cb.value);
            const userId = getUserId();
            const tbody = document.getElementById('logs-table-body');
            try {
                const res = await fetch(`/api/history?userId=${encodeURIComponent(userId)}`);
                globalLogs = await res.json();

                if (!Array.isArray(globalLogs) || !globalLogs.length) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-secondary); padding: 30px;">No activity logs recorded yet.</td></tr>`;
                    document.getElementById('selectAllCheckbox').checked = false;
                    updateSelectionCount();
                    return;
                }

                tbody.innerHTML = '';
                globalLogs.forEach((log, index) => {
                    let badgeClass = 'badge-system';
                    if (log.type === 'batch') badgeClass = 'badge-batch';
                    else if (log.type === 'fallback') badgeClass = 'badge-fallback';
                    else if (log.type === 'scheduled') badgeClass = 'badge-scheduled';
                    else if (log.type === 'incoming') badgeClass = 'badge-incoming';
                    else if (log.type === 'outgoing') badgeClass = 'badge-outgoing';

                    const logId = log.id || index;
                    const isChecked = activeSelectedIds.includes(logId.toString()) ? 'checked' : '';

                    tbody.innerHTML += `
                        <tr>
                            <td onclick="event.stopPropagation()">
                                <input type="checkbox" class="log-checkbox" value="${logId}" ${isChecked} onchange="updateSelectionCount()">
                            </td>
                            <td><span class="history-badge ${badgeClass}">${log.type || 'system'}</span></td>
                            <td style="color: var(--accent-indigo-bright); font-family: monospace;">${log.recipient || 'N/A'}</td>
                            <td style="color: var(--text-primary); max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${escapeHtml(log.message || '')}">${escapeHtml(log.message || '')}</td>
                            <td style="color: var(--text-secondary); font-size: 0.76rem;">${log.timestamp ? new Date(log.timestamp).toLocaleTimeString() : ''}</td>
                        </tr>
                    `;
                });

                const rows = tbody.querySelectorAll('tr');
                rows.forEach((row, index) => {
                    row.style.cursor = 'pointer';
                    row.onclick = (e) => {
                        if (e.target.tagName !== 'INPUT') openLogDetails(index);
                    };
                });

                updateSelectionCount();
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--accent-crimson); padding: 30px;">Failed to load live logs.</td></tr>`;
            }
        }

        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAllCheckbox');
            const checkboxes = document.querySelectorAll('.log-checkbox');
            checkboxes.forEach(cb => cb.checked = selectAll.checked);
            updateSelectionCount();
        }

        function updateSelectionCount() {
            const checkboxes = document.querySelectorAll('.log-checkbox');
            const checkedBoxes = document.querySelectorAll('.log-checkbox:checked');
            const selectAll = document.getElementById('selectAllCheckbox');
            selectAll.checked = checkboxes.length > 0 && checkedBoxes.length === checkboxes.length;
            document.getElementById('selection-count').textContent = `${checkedBoxes.length} selected`;
        }

        async function deleteSelectedLogs() {
            const checkedBoxes = document.querySelectorAll('.log-checkbox:checked');
            if (checkedBoxes.length === 0) {
                alert('⚠️ Please select at least one log row to delete.');
                return;
            }
            if (!confirm(`Are you sure you want to delete ${checkedBoxes.length} selected log(s)?`)) return;

            const userId = getUserId();
            const idsToDelete = Array.from(checkedBoxes).map(cb => cb.value);

            try {
                const res = await fetch(`/api/history/delete-batch?userId=${encodeURIComponent(userId)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ids: idsToDelete })
                });
                const data = await res.json();
                if (res.ok) fetchHistoryLogs();
                else alert('❌ Failed: ' + (data.status || 'Unknown error'));
            } catch (err) {
                alert('❌ Network error while deleting selected logs.');
            }
        }

        async function clearAllLogs() {
            if (!confirm('⚠️ Are you sure you want to clear ALL activity logs permanently from database and memory?')) return;

            const userId = getUserId();
            try {
                const res = await fetch(`/api/history/delete-batch?userId=${encodeURIComponent(userId)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ clearAll: true })
                });
                const data = await res.json();
                if (res.ok) fetchHistoryLogs();
                else alert('❌ Failed: ' + (data.status || 'Unknown error'));
            } catch (err) {
                alert('❌ Network error while clearing logs.');
            }
        }

        function openLogDetails(index) {
            const log = globalLogs[index];
            if (!log) return;
            const dt = log.timestamp ? new Date(log.timestamp) : new Date();
            document.getElementById('modal-details-body').innerHTML = `
                <p><span>Event ID:</span> ${log.id || 'N/A'}</p>
                <p><span>Type:</span> <strong style="color: var(--accent-indigo-bright); text-transform:uppercase;">${log.type || 'system'}</strong></p>
                <p><span>Date:</span> ${dt.toLocaleDateString()}</p>
                <p><span>Time:</span> ${dt.toLocaleTimeString()}</p>
                <p><span>Recipient / Target:</span> ${log.recipient || 'N/A'}</p>
                <p><span>Message / Content:</span><br><div style="background: rgba(6,8,14,0.92); padding: 12px; border-radius: 10px; border: 1px solid var(--border-subtle); margin-top: 6px; color: var(--accent-indigo-bright);">${escapeHtml(log.message || 'No message content')}</div></p>
                ${log.details && Object.keys(log.details).length ? `<p style="margin-top:10px;"><span>Extra Details:</span><br><pre style="font-size:0.78rem; color:var(--accent-emerald-bright); background:rgba(6,8,14,0.92); padding:10px; border-radius:10px; overflow-x:auto;">${JSON.stringify(log.details, null, 2)}</pre></p>` : ''}
            `;
            document.getElementById('log-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('log-modal').style.display = 'none'; }

        function escapeHtml(text) {
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        window.onload = () => {
            getUserId();
            fetchHistoryLogs();
            setInterval(fetchHistoryLogs, 10000);
        };
    </script>
</body>
</html>
