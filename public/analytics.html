<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Feed - Nexon SaaS</title>
    <style>
        :root {
            --bg-base: #090d16;
            --metallic-panel: linear-gradient(135deg, rgba(20, 27, 45, 0.95) 0%, rgba(10, 14, 26, 0.98) 100%);
            --neon-cyan: #38bdf8;
            --neon-emerald: #34d399;
            --neon-amber: #fbbf24;
            --neon-rose: #f43f5e;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace, sans-serif; }
        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(56, 189, 248, 0.25) 0%, transparent 60%),
                linear-gradient(rgba(15, 23, 42, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(15, 23, 42, 0.3) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-main); min-height: 100vh; padding: 40px;
        }
        .wrapper { max-width: 950px; margin: 0 auto; }
        .back-btn { display: inline-block; color: var(--neon-cyan); text-decoration: none; margin-bottom: 20px; font-size: 0.9rem; text-shadow: 0 0 8px rgba(56,189,248,0.4); }
        .back-btn:hover { text-decoration: underline; }
        .panel {
            background: var(--metallic-panel); border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 14px; padding: 35px; box-shadow: 0 15px 45px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            position: relative; overflow: hidden;
        }
        .panel::before {
            content: ''; position: absolute; top: 0; left: 0; width: 6px; height: 100%;
            background: linear-gradient(to bottom, var(--neon-cyan), var(--neon-emerald));
            box-shadow: 0 0 12px var(--neon-cyan);
        }
        h2 { color: var(--neon-cyan); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; text-shadow: 0 0 10px rgba(56,189,248,0.4); font-size: 1.4rem; flex-wrap: wrap; gap: 10px; }
        
        .actions-bar {
            display: flex; gap: 10px; align-items: center; margin-bottom: 15px; flex-wrap: wrap;
        }
        .btn-alt {
            background: linear-gradient(135deg, #059669 0%, #047857 100%); color: white; border: none;
            padding: 8px 14px; font-size: 0.75rem; border-radius: 6px; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 2px 10px rgba(5,150,105,0.3); transition: 0.3s; font-weight: bold;
        }
        .btn-alt:hover { box-shadow: 0 4px 15px rgba(52,211,153,0.5); transform: translateY(-1px); }

        .btn-danger {
            background: linear-gradient(135deg, var(--neon-rose), #be123c); color: white; border: none;
            padding: 8px 14px; font-size: 0.75rem; border-radius: 6px; cursor: pointer; text-transform: uppercase;
            box-shadow: 0 2px 10px rgba(244,63,94,0.3); transition: 0.3s; font-weight: bold;
        }
        .btn-danger:hover { box-shadow: 0 4px 15px rgba(244,63,94,0.5); transform: translateY(-1px); }

        .table-container { max-height: 480px; overflow-y: auto; border: 1px solid #334155; border-radius: 8px; background: rgba(2, 6, 23, 0.85); box-shadow: inset 0 2px 6px rgba(0,0,0,0.6); }
        
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.82rem; }
        th, td { padding: 12px 14px; border-bottom: 1px solid rgba(51,65,85,0.4); }
        th { background: rgba(15, 23, 42, 0.95); color: var(--neon-cyan); position: sticky; top: 0; z-index: 10; text-transform: uppercase; font-size: 0.72rem; letter-spacing: 1px; }
        tr:hover { background: rgba(56, 189, 248, 0.05); }

        .history-badge { padding: 3px 8px; border-radius: 4px; font-size: 0.68rem; text-transform: uppercase; font-weight: bold; display: inline-block; }
        .badge-scheduled { background: rgba(251,191,36,0.2); color: var(--neon-amber); border: 1px solid rgba(251,191,36,0.4); }
        .badge-batch { background: rgba(52,211,153,0.2); color: var(--neon-emerald); border: 1px solid rgba(52,211,153,0.4); }
        .badge-fallback { background: rgba(244,63,94,0.2); color: var(--neon-rose); border: 1px solid rgba(244,63,94,0.4); }
        .badge-incoming { background: rgba(56,189,248,0.2); color: var(--neon-cyan); border: 1px solid rgba(56,189,248,0.4); }
        .badge-outgoing { background: rgba(56,189,248,0.2); color: var(--neon-cyan); border: 1px solid rgba(56,189,248,0.4); }
        .badge-system { background: rgba(148,163,184,0.2); color: var(--text-muted); border: 1px solid rgba(148,163,184,0.4); }

        input[type="checkbox"] { accent-color: var(--neon-cyan); width: 15px; height: 15px; cursor: pointer; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px;
        }
        .modal-content {
            background: var(--metallic-panel); border: 1px solid var(--neon-cyan);
            border-radius: 12px; width: 100%; max-width: 600px; padding: 30px;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.4); position: relative;
        }
        .modal-content h3 { color: var(--neon-cyan); margin-bottom: 15px; font-size: 1.2rem; }
        .modal-body { font-size: 0.88rem; line-height: 1.6; color: var(--text-main); margin-bottom: 20px; word-break: break-all; }
        .modal-body p { margin-bottom: 8px; }
        .modal-body span { color: var(--text-muted); }
        .modal-close {
            background: var(--neon-rose); color: white; border: none; padding: 8px 16px;
            border-radius: 6px; cursor: pointer; font-weight: bold; text-transform: uppercase; float: right;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <a href="#" id="back-dashboard" class="back-btn">&larr; Back to Control Center</a>
        <div class="panel">
            <h2>
                <span>📊 Live Analytics & System Audit Feed</span>
                <div style="display: flex; gap: 8px;">
                    <button class="btn-alt" onclick="fetchHistoryLogs()">Refresh</button>
                </div>
            </h2>
            
            <div class="actions-bar">
                <button class="btn-alt" style="background: linear-gradient(135deg, #0284c7, #0369a1);" onclick="deleteSelectedLogs()">Delete Selected</button>
                <button class="btn-danger" onclick="clearAllLogs()">Clear All Logs</button>
                <span id="selection-count" style="font-size: 0.78rem; color: var(--text-muted); margin-left: auto;">0 selected</span>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th width="40"><input type="checkbox" id="selectAllCheckbox" onclick="toggleSelectAll()"></th>
                            <th width="110">Type</th>
                            <th width="150">Recipient / Sender</th>
                            <th>Message Content</th>
                            <th width="110">Timestamp</th>
                        </tr>
                    </thead>
                    <tbody id="logs-table-body">
                        <tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 30px;">Loading activity logs...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="log-modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3>🔍 Log Event Inspector</h3>
            <div class="modal-body" id="modal-details-body"></div>
            <button class="modal-close" onclick="closeModal()">Close</button>
            <div style="clear: both;"></div>
        </div>
    </div>

    <script>
        let globalLogs = [];

        function getUserId() {
            const urlParams = new URLSearchParams(window.location.search);
            let userId = urlParams.get('userId') || localStorage.getItem('nexonUserId');
            if (userId) {
                document.getElementById('back-dashboard').setAttribute('href', `/dashboard.html?userId=${userId}`);
            } else {
                document.getElementById('back-dashboard').setAttribute('href', `/dashboard.html`);
            }
            return userId || 'default_user';
        }

        async function fetchHistoryLogs() {
            const userId = getUserId();
            const tbody = document.getElementById('logs-table-body');
            try {
                const res = await fetch(`/api/history?userId=${userId}`);
                globalLogs = await res.json();
                
                if (!Array.isArray(globalLogs) || !globalLogs.length) { 
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 30px;">No activity logs recorded yet.</td></tr>`; 
                    document.getElementById('selectAllCheckbox').checked = false;
                    updateSelectionCount();
                    return; 
                }
                
                tbody.innerHTML = '';
                globalLogs.forEach((log, index) => {
                    let badgeClass = 'badge-system';
                    if (log.type === 'batch') badgeClass = 'badge-batch';
                    else if (log.type === 'fallback') badgeClass = 'badge-fallback';
                    else if (log.type === 'scheduled') badgeClass = 'badge-scheduled';
                    else if (log.type === 'incoming') badgeClass = 'badge-incoming';
                    else if (log.type === 'outgoing') badgeClass = 'badge-outgoing';

                    tbody.innerHTML += `
                        <tr>
                            <td onclick="event.stopPropagation()">
                                <input type="checkbox" class="log-checkbox" value="${log.id || index}" onchange="updateSelectionCount()">
                            </td>
                            <td><span class="history-badge ${badgeClass}">${log.type || 'system'}</span></td>
                            <td style="color: var(--neon-cyan); font-family: monospace;">${log.recipient || 'N/A'}</td>
                            <td style="color: var(--text-main); max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${escapeHtml(log.message || '')}">${escapeHtml(log.message || '')}</td>
                            <td style="color: var(--text-muted); font-size: 0.72rem;">${log.timestamp ? new Date(log.timestamp).toLocaleTimeString() : ''}</td>
                        </tr>
                    `;
                });
                
                // Add click listener to table rows for opening inspector modal (ignoring checkbox clicks)
                const rows = tbody.querySelectorAll('tr');
                rows.forEach((row, index) => {
                    row.style.cursor = 'pointer';
                    row.onclick = (e) => {
                        if (e.target.tagName !== 'INPUT') {
                            openLogDetails(index);
                        }
                    };
                });

                document.getElementById('selectAllCheckbox').checked = false;
                updateSelectionCount();
            } catch(e) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--neon-rose); padding: 30px;">Failed to load live logs.</td></tr>`;
            }
        }

        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAllCheckbox');
            const checkboxes = document.querySelectorAll('.log-checkbox');
            checkboxes.forEach(cb => cb.checked = selectAll.checked);
            updateSelectionCount();
        }

        function updateSelectionCount() {
            const selectedCount = document.querySelectorAll('.log-checkbox:checked').length;
            document.getElementById('selection-count').textContent = `${selectedCount} selected`;
        }

        async function deleteSelectedLogs() {
            const checkedBoxes = document.querySelectorAll('.log-checkbox:checked');
            if (checkedBoxes.length === 0) {
                alert('⚠️ Please select at least one log row to delete.');
                return;
            }

            if (!confirm(`Are you sure you want to delete ${checkedBoxes.length} selected log(s)?`)) return;

            const userId = getUserId();
            const idsToDelete = Array.from(checkedBoxes).map(cb => cb.value);

            try {
                const res = await fetch(`/api/history/delete-batch?userId=${userId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ids: idsToDelete })
                });
                const data = await res.json();
                if (res.ok) {
                    fetchHistoryLogs();
                } else {
                    alert('❌ Failed: ' + (data.status || 'Unknown error'));
                }
            } catch (err) {
                alert('❌ Network error while deleting selected logs.');
            }
        }

        async function clearAllLogs() {
            if (!confirm('⚠️ Are you sure you want to clear ALL activity logs permanently from database and memory?')) return;

            const userId = getUserId();
            try {
                const res = await fetch(`/api/history/delete-batch?userId=${userId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ clearAll: true })
                });
                const data = await res.json();
                if (res.ok) {
                    fetchHistoryLogs();
                } else {
                    alert('❌ Failed: ' + (data.status || 'Unknown error'));
                }
            } catch (err) {
                alert('❌ Network error while clearing logs.');
            }
        }

        function openLogDetails(index) {
            const log = globalLogs[index];
            if (!log) return;
            const dt = log.timestamp ? new Date(log.timestamp) : new Date();
            document.getElementById('modal-details-body').innerHTML = `
                <p><span>Event ID:</span> ${log.id || 'N/A'}</p>
                <p><span>Type:</span> <strong style="color: var(--neon-cyan); text-transform:uppercase;">${log.type || 'system'}</strong></p>
                <p><span>Date:</span> ${dt.toLocaleDateString()}</p>
                <p><span>Time:</span> ${dt.toLocaleTimeString()}</p>
                <p><span>Recipient / Target:</span> ${log.recipient || 'N/A'}</p>
                <p><span>Message / Content:</span><br><div style="background: rgba(2,6,23,0.9); padding: 10px; border-radius: 6px; border: 1px solid #334155; margin-top: 4px; color: #38bdf8; word-break: break-word;">${log.message || 'No message content'}</div></p>
                ${log.details && Object.keys(log.details).length ? `<p style="margin-top:10px;"><span>Extra Details:</span><br><pre style="font-size:0.75rem; color:#34d399; background:rgba(2,6,23,0.9); padding:8px; border-radius:6px; overflow-x:auto;">${JSON.stringify(log.details, null, 2)}</pre></p>` : ''}
            `;
            document.getElementById('log-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('log-modal').style.display = 'none'; }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        window.onload = () => { 
            getUserId();
            fetchHistoryLogs(); 
            setInterval(fetchHistoryLogs, 5000); 
        };
    </script>
</body>
</html>
