<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXON // Custom Message Batches</title>
    <style>
        :root {
            --bg-obsidian: #06080e;
            --bg-card: rgba(15, 21, 36, 0.9);
            --border-subtle: rgba(148, 163, 184, 0.14);
            --border-indigo: rgba(99, 102, 241, 0.48);
            --accent-indigo: #6366f1;
            --accent-indigo-bright: #818cf8;
            --accent-emerald: #10b981;
            --accent-emerald-bright: #34d399;
            --accent-crimson: #ef4444;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --shadow-deck: 0 24px 60px rgba(0, 0, 0, 0.78);
            --shadow-indigo: 0 0 28px rgba(99, 102, 241, 0.25);
            --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-obsidian);
            background-image:
                radial-gradient(circle at 15% 10%, rgba(99, 102, 241, 0.18), transparent 42%),
                radial-gradient(circle at 85% 20%, rgba(16, 185, 129, 0.12), transparent 42%),
                linear-gradient(180deg, #06080e 0%, #090d18 60%, #06080e 100%);
            color: var(--text-primary);
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            padding: 32px 24px 60px;
        }

        @keyframes deckSlideUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .wrapper { max-width: 920px; margin: 0 auto; animation: deckSlideUp 0.6s var(--ease-smooth) both; }

        .back-btn {
            display: inline-flex; align-items: center; gap: 8px;
            color: var(--accent-indigo-bright); text-decoration: none;
            font-size: 0.86rem; font-weight: 600; margin-bottom: 18px;
            padding: 8px 14px; border-radius: 10px;
            background: rgba(15, 21, 36, 0.75); border: 1px solid var(--border-subtle);
            transition: all 0.25s var(--ease-smooth);
        }
        .back-btn:hover {
            color: #fff; border-color: var(--border-indigo);
            transform: translateX(-3px); box-shadow: var(--shadow-indigo);
        }

        .panel {
            background: var(--bg-card); border: 1px solid var(--border-subtle);
            border-radius: 20px; padding: 34px;
            box-shadow: var(--shadow-deck), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px); position: relative; overflow: hidden;
        }
        .panel::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--accent-indigo), var(--accent-emerald));
        }

        .eyebrow {
            font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em;
            text-transform: uppercase; color: var(--accent-indigo-bright); margin-bottom: 6px;
        }
        h2 {
            font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em;
            margin-bottom: 22px; display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 12px;
        }

        input[type="text"], textarea {
            width: 100%; background: rgba(6, 8, 14, 0.92);
            border: 1px solid var(--border-subtle); padding: 11px 14px;
            color: var(--text-primary); border-radius: 11px; font-size: 0.88rem; outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }
        input:focus, textarea:focus {
            border-color: var(--accent-indigo-bright);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-indigo), #4f46e5);
            color: #fff; border: 1px solid rgba(129, 140, 248, 0.45);
            padding: 13px 20px; font-weight: 700; border-radius: 12px; cursor: pointer;
            letter-spacing: 0.04em; width: 100%; margin-top: 16px; font-size: 0.86rem;
            box-shadow: 0 8px 22px rgba(99, 102, 241, 0.28);
            transition: all 0.28s var(--ease-smooth);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(99, 102, 241, 0.42); }

        .btn-alt {
            background: linear-gradient(135deg, var(--accent-emerald), #059669);
            color: #05110d; border: 1px solid rgba(52, 211, 153, 0.55);
            padding: 8px 14px; font-size: 0.78rem; font-weight: 700;
            border-radius: 10px; cursor: pointer; transition: all 0.25s var(--ease-smooth);
        }
        .btn-alt:hover { transform: translateY(-1px); }

        .btn-danger {
            background: linear-gradient(135deg, var(--accent-crimson), #be123c);
            color: #fff; border: none; padding: 7px 12px; font-size: 0.75rem;
            font-weight: 700; border-radius: 8px; cursor: pointer;
        }

        .batch-card {
            background: rgba(11, 16, 28, 0.9); border: 1px solid var(--border-subtle);
            padding: 20px; border-radius: 16px; margin-bottom: 16px;
            transition: border-color 0.25s ease;
        }
        .batch-card:hover { border-color: var(--border-indigo); }

        .batch-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; }

        .contact-list-box {
            max-height: 165px; overflow-y: auto; border: 1px solid var(--border-subtle);
            border-radius: 10px; background: rgba(6, 8, 14, 0.92); padding: 6px; margin-top: 6px;
        }
        .contact-item {
            padding: 6px 10px; border-bottom: 1px solid rgba(148, 163, 184, 0.08);
            font-size: 0.82rem; display: flex; align-items: center; gap: 10px;
        }
        .contact-item:hover { background: rgba(99, 102, 241, 0.1); }
    </style>
</head>
<body>
    <div class="wrapper">
        <a href="dashboard.html" id="back-dashboard" class="back-btn">← Back to Hub</a>
        <div class="panel">
            <div class="eyebrow">Targeted Group Replies</div>
            <h2>
                <span>Custom Message Batches</span>
                <button type="button" class="btn-alt" onclick="addNewBatch()">+ Create New Batch</button>
            </h2>
            <div id="batches-container"></div>
            <button type="button" class="btn" onclick="saveAllBatches()">Save & Deploy All Batches</button>
        </div>
    </div>

    <script>
        let cachedContacts = [];
        let batchesList = [];

        function getUserId() {
            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('userId') || localStorage.getItem('nexonUserId');
            if (userId) {
                document.getElementById('back-dashboard').setAttribute('href', `/dashboard.html?userId=${encodeURIComponent(userId)}`);
            }
            return userId || 'default_user';
        }

        async function init() {
            const userId = getUserId();
            try {
                const resC = await fetch(`/api/contacts?userId=${encodeURIComponent(userId)}`);
                cachedContacts = await resC.json();
                const resB = await fetch(`/api/batches?userId=${encodeURIComponent(userId)}`);
                batchesList = await resB.json();
                renderBatches();
            } catch (e) { console.error(e); }
        }

        function addNewBatch() {
            batchesList.push({ id: 'batch_' + Date.now(), name: 'New Batch', contacts: [], message: 'Hello reply.', isSaved: false });
            renderBatches();
        }

        function removeBatch(id) {
            const userId = getUserId();
            batchesList = batchesList.filter(b => b.id !== id);
            fetch('/api/batches', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, batches: batchesList })
            });
            renderBatches();
        }

        function editBatch(id) {
            const batch = batchesList.find(x => x.id === id);
            if (batch) {
                batch.isSaved = false;
                renderBatches();
            }
        }

        function renderBatches() {
            const container = document.getElementById('batches-container');
            if (!batchesList.length) {
                container.innerHTML = `<p style="color: var(--text-secondary); text-align: center; padding: 24px;">No batches created yet.</p>`;
                return;
            }
            container.innerHTML = '';

            batchesList.forEach(batch => {
                const card = document.createElement('div');
                card.className = 'batch-card';
                if (batch.isSaved) {
                    card.innerHTML = `
                        <div class="batch-header">
                            <h3 style="color: var(--accent-indigo-bright); font-size: 0.98rem;">📂 ${batch.name} (${batch.contacts.length} contacts)</h3>
                            <div style="display: flex; gap: 8px;">
                                <button type="button" class="btn-alt" onclick="editBatch('${batch.id}')">Edit</button>
                                <button type="button" class="btn-danger" onclick="removeBatch('${batch.id}')">Delete</button>
                            </div>
                        </div>
                        <p style="font-size: 0.84rem; color: var(--text-secondary);">Reply: "${batch.message}"</p>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="batch-header">
                            <input type="text" value="${batch.name}" onchange="batchesList.find(x=>x.id==='${batch.id}').name=this.value" style="width: 55%;">
                            <button type="button" class="btn-alt" onclick="saveSingleBatch('${batch.id}')">Save</button>
                        </div>
                        <label style="font-size:0.74rem; color:var(--text-secondary); margin-top:8px; display:block; text-transform:uppercase;">Search & Select Contacts for Batch:</label>
                        <input type="text" id="search_${batch.id}" placeholder="Type name or phone number..." onkeyup="filterBatchContacts('${batch.id}')" style="margin-bottom: 6px;">
                        <div class="contact-list-box" id="listbox_${batch.id}">
                            ${renderBatchContactsList(batch)}
                        </div>
                        <label style="font-size:0.74rem; color:var(--text-secondary); margin-top:10px; display:block; text-transform:uppercase;">Custom Reply Message:</label>
                        <textarea rows="2" onchange="batchesList.find(x=>x.id==='${batch.id}').message=this.value">${batch.message}</textarea>
                    `;
                }
                container.appendChild(card);
            });
        }

        function renderBatchContactsList(batch, filterQuery = '') {
            if (!cachedContacts.length) return `<div class="contact-item" style="color: var(--text-secondary);">No contacts available.</div>`;
            const q = filterQuery.toLowerCase();
            const filtered = cachedContacts.filter(c => c.name.toLowerCase().includes(q) || c.id.includes(q));
            if (!filtered.length) return `<div class="contact-item" style="color: var(--text-secondary);">No matching contacts.</div>`;

            let html = '';
            filtered.forEach(c => {
                const isChecked = batch.contacts.includes(c.id) ? 'checked' : '';
                html += `
                    <div class="contact-item">
                        <input type="checkbox" class="cb_${batch.id}" data-contact-id="${c.id}" ${isChecked} style="width: auto; cursor: pointer;">
                        <span style="flex-grow: 1;">${c.name}</span>
                        <span style="color: var(--accent-indigo-bright); font-size: 0.76rem; font-family: monospace;">${c.id}</span>
                    </div>
                `;
            });
            return html;
        }

        function filterBatchContacts(batchId) {
            const query = document.getElementById(`search_${batchId}`).value;
            const batch = batchesList.find(x => x.id === batchId);
            if (!batch) return;

            const checkedBoxes = document.querySelectorAll(`.cb_${batchId}:checked`);
            checkedBoxes.forEach(cb => {
                const cid = cb.getAttribute('data-contact-id');
                if (!batch.contacts.includes(cid)) batch.contacts.push(cid);
            });

            const allBoxes = document.querySelectorAll(`.cb_${batchId}`);
            allBoxes.forEach(cb => {
                const cid = cb.getAttribute('data-contact-id');
                if (!cb.checked) {
                    batch.contacts = batch.contacts.filter(id => id !== cid);
                }
            });

            document.getElementById(`listbox_${batchId}`).innerHTML = renderBatchContactsList(batch, query);
        }

        function saveSingleBatch(id) {
            const batch = batchesList.find(x => x.id === id);
            if (!batch) return;

            const checkedBoxes = document.querySelectorAll(`.cb_${id}:checked`);
            checkedBoxes.forEach(cb => {
                const cid = cb.getAttribute('data-contact-id');
                if (!batch.contacts.includes(cid)) batch.contacts.push(cid);
            });

            const allBoxes = document.querySelectorAll(`.cb_${id}`);
            allBoxes.forEach(cb => {
                const cid = cb.getAttribute('data-contact-id');
                if (!cb.checked) {
                    batch.contacts = batch.contacts.filter(id => id !== cid);
                }
            });

            batch.isSaved = true;
            saveAllBatchesToServer();
            renderBatches();
        }

        async function saveAllBatches() {
            batchesList.forEach(b => {
                b.isSaved = true;
                const cbs = document.querySelectorAll(`.cb_${b.id}:checked`);
                cbs.forEach(cb => {
                    const cid = cb.getAttribute('data-contact-id');
                    if (!b.contacts.includes(cid)) b.contacts.push(cid);
                });
            });
            await saveAllBatchesToServer();
            alert('All batches saved & deployed successfully!');
            renderBatches();
        }

        async function saveAllBatchesToServer() {
            const userId = getUserId();
            try {
                await fetch('/api/batches', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, batches: batchesList })
                });
            } catch (e) { console.error(e); }
        }

        window.onload = init;
    </script>
</body>
</html>
