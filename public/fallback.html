<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexon SaaS - Unknown Fallback Settings</title>
    <style>
        :root {
            --bg-base: #090d16;
            --metallic-panel: linear-gradient(135deg, rgba(20, 27, 45, 0.95) 0%, rgba(10, 14, 26, 0.98) 100%);
            --metallic-border: linear-gradient(135deg, rgba(56, 189, 248, 0.6), rgba(30, 41, 59, 0.8), rgba(56, 189, 248, 0.2));
            --neon-cyan: #38bdf8;
            --neon-emerald: #34d399;
            --neon-rose: #f43f5e;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace, sans-serif; }
        
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px;
        }

        .wrapper { max-width: 800px; margin: 0 auto; }

        .panel {
            background: var(--metallic-panel);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-image: var(--metallic-border) 1;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.8);
            margin-top: 20px;
        }

        h2 { font-size: 1.6rem; color: var(--neon-cyan); letter-spacing: 2px; margin-bottom: 8px; text-shadow: 0 0 10px rgba(56,189,248,0.5); }
        p.subtitle { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 25px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        
        textarea {
            width: 100%;
            height: 140px;
            background: rgba(2, 6, 23, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 12px 16px;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            resize: vertical;
        }
        textarea:focus { border-color: var(--neon-cyan); box-shadow: 0 0 12px rgba(56,189,248,0.4); }

        .btn {
            background: linear-gradient(135deg, var(--neon-emerald), #059669);
            color: #090d16;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            box-shadow: 0 0 15px rgba(52, 211, 153, 0.4);
            transition: 0.3s;
        }
        .btn:hover { box-shadow: 0 0 25px rgba(52, 211, 153, 0.8); transform: translateY(-2px); }

        .back-link { display: inline-block; margin-bottom: 20px; color: var(--neon-cyan); text-decoration: none; font-size: 0.85rem; }
        .back-link:hover { text-decoration: underline; }

        #status-msg { margin-top: 15px; font-size: 0.85rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="wrapper">
        <a href="/dashboard.html" id="back-dashboard" class="back-link">&larr; Back to Control Center</a>
        
        <div class="panel">
            <h2>💬 UNKNOWN FALLBACK SETTINGS</h2>
            <p class="subtitle">Configure your custom auto-reply template for non-VCF numbers.</p>

            <div class="form-group">
                <label>Fallback Auto-Reply Message</label>
                <textarea id="fallback-msg" placeholder="Enter fallback message..."></textarea>
            </div>

            <button class="btn" onclick="saveFallback()">Save Fallback Message</button>
            <div id="status-msg"></div>
        </div>
    </div>

    <script>
        function getUserId() {
            const urlParams = new URLSearchParams(window.location.search);
            let userId = urlParams.get('userId') || localStorage.getItem('nexonUserId');
            if (userId) {
                document.getElementById('back-dashboard').setAttribute('href', `/dashboard.html?userId=${userId}`);
            }
            return userId || 'default_user';
        }

        async function loadFallback() {
            const userId = getUserId();
            try {
                const res = await fetch(`/api/config?userId=${userId}`);
                const data = await res.json();
                if (data.fallbackMessage) {
                    document.getElementById('fallback-msg').value = data.fallbackMessage;
                }
            } catch (err) {
                console.error('Failed to load fallback:', err);
            }
        }

        async function saveFallback() {
            const userId = getUserId();
            const fallbackMessage = document.getElementById('fallback-msg').value.trim();
            const statusMsg = document.getElementById('status-msg');

            try {
                const res = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, fallbackMessage })
                });
                const data = await res.json();
                statusMsg.style.color = 'var(--neon-emerald)';
                statusMsg.textContent = '✅ Fallback message saved successfully and active!';
            } catch (err) {
                statusMsg.style.color = 'var(--neon-rose)';
                statusMsg.textContent = '❌ Failed to save fallback message.';
            }
        }

        window.onload = loadFallback;
    </script>
</body>
</html>
