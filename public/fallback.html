<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXON // Unknown Fallback Settings</title>
    <style>
        :root {
            --bg-obsidian: #06080e;
            --bg-card: rgba(15, 21, 36, 0.9);
            --border-subtle: rgba(148, 163, 184, 0.14);
            --border-indigo: rgba(99, 102, 241, 0.48);
            --accent-indigo: #6366f1;
            --accent-indigo-bright: #818cf8;
            --accent-emerald: #10b981;
            --accent-emerald-bright: #34d399;
            --accent-crimson: #ef4444;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --shadow-deck: 0 24px 60px rgba(0, 0, 0, 0.78);
            --shadow-indigo: 0 0 28px rgba(99, 102, 241, 0.25);
            --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-obsidian);
            background-image:
                radial-gradient(circle at 15% 10%, rgba(99, 102, 241, 0.18), transparent 42%),
                radial-gradient(circle at 85% 20%, rgba(16, 185, 129, 0.12), transparent 42%),
                linear-gradient(180deg, #06080e 0%, #090d18 60%, #06080e 100%);
            color: var(--text-primary);
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            padding: 32px 24px 60px;
        }

        @keyframes deckSlideUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .wrapper { max-width: 820px; margin: 0 auto; animation: deckSlideUp 0.6s var(--ease-smooth) both; }

        .back-link {
            display: inline-flex; align-items: center; gap: 8px;
            color: var(--accent-indigo-bright); text-decoration: none;
            font-size: 0.86rem; font-weight: 600; margin-bottom: 18px;
            padding: 8px 14px; border-radius: 10px;
            background: rgba(15, 21, 36, 0.75); border: 1px solid var(--border-subtle);
            transition: all 0.25s var(--ease-smooth);
        }
        .back-link:hover {
            color: #fff; border-color: var(--border-indigo);
            transform: translateX(-3px); box-shadow: var(--shadow-indigo);
        }

        .panel {
            background: var(--bg-card); border: 1px solid var(--border-subtle);
            border-radius: 20px; padding: 34px;
            box-shadow: var(--shadow-deck), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px); position: relative; overflow: hidden;
        }
        .panel::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--accent-indigo), var(--accent-emerald));
        }

        .eyebrow {
            font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em;
            text-transform: uppercase; color: var(--accent-indigo-bright); margin-bottom: 6px;
        }
        h2 { font-size: 1.65rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
        p.subtitle { color: var(--text-secondary); font-size: 0.88rem; margin-bottom: 24px; line-height: 1.5; }

        .form-group { margin-bottom: 22px; }
        label {
            display: block; font-size: 0.78rem; font-weight: 700;
            letter-spacing: 0.08em; text-transform: uppercase;
            color: var(--text-secondary); margin-bottom: 10px;
        }

        textarea {
            width: 100%; height: 150px; background: rgba(6, 8, 14, 0.92);
            border: 1px solid var(--border-subtle); padding: 14px 16px;
            border-radius: 12px; color: var(--text-primary); font-size: 0.92rem;
            outline: none; resize: vertical; line-height: 1.5;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }
        textarea:focus {
            border-color: var(--accent-indigo-bright);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-emerald), #059669);
            color: #05110d; border: 1px solid rgba(52, 211, 153, 0.55);
            padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer;
            letter-spacing: 0.04em; font-size: 0.86rem;
            box-shadow: 0 8px 22px rgba(16, 185, 129, 0.28);
            transition: all 0.28s var(--ease-smooth);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(16, 185, 129, 0.42); }
        .btn:active { transform: translateY(0) scale(0.98); }

        #status-msg { margin-top: 16px; font-size: 0.88rem; font-weight: 600; }
    </style>
</head>
<body>
    <div class="wrapper">
        <a href="/dashboard.html" id="back-dashboard" class="back-link">&larr; Back to Control Center</a>

        <div class="panel">
            <div class="eyebrow">Auto-Responder Engine</div>
            <h2>💬 UNKNOWN FALLBACK SETTINGS</h2>
            <p class="subtitle">Configure your custom auto-reply template for non-VCF numbers.</p>

            <div class="form-group">
                <label>Fallback Auto-Reply Message</label>
                <textarea id="fallback-msg" placeholder="Enter fallback message..."></textarea>
            </div>

            <button type="button" class="btn" onclick="saveFallback()">Save Fallback Message</button>
            <div id="status-msg"></div>
        </div>
    </div>

    <script>
        function getUserId() {
            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('userId') || localStorage.getItem('nexonUserId');
            if (userId) {
                document.getElementById('back-dashboard').setAttribute('href', `/dashboard.html?userId=${encodeURIComponent(userId)}`);
            }
            return userId || 'default_user';
        }

        async function loadFallback() {
            const userId = getUserId();
            try {
                const res = await fetch(`/api/config?userId=${encodeURIComponent(userId)}`);
                const data = await res.json();
                if (data.fallbackMessage) {
                    document.getElementById('fallback-msg').value = data.fallbackMessage;
                }
            } catch (err) {
                console.error('Failed to load fallback:', err);
            }
        }

        async function saveFallback() {
            const userId = getUserId();
            const fallbackMessage = document.getElementById('fallback-msg').value.trim();
            const statusMsg = document.getElementById('status-msg');

            try {
                await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, fallbackMessage })
                });
                statusMsg.style.color = 'var(--accent-emerald-bright)';
                statusMsg.textContent = '✅ Fallback message saved successfully and active!';
            } catch (err) {
                statusMsg.style.color = 'var(--accent-crimson)';
                statusMsg.textContent = '❌ Failed to save fallback message.';
            }
        }

        window.onload = loadFallback;
    </script>
</body>
</html>s
